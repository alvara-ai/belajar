<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pencatat Keuangan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🔐 Masuk ke Akun</h1>
        <p style="text-align: center;">Silakan masuk untuk mencatat keuanganmu.</p>

        <!-- Form Login -->
        <form id="form-login">
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Masukkan username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Masukkan password" required>

            <!-- Mengalihkan ke dashboard.html saat tombol diklik -->
            <button type="button" onclick="window.location.href='dashboard.html'">Masuk</button>
        </form>
    </div>

</body>
</html>
